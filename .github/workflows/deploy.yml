name: Deploy Almoxarifado to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Add PWA files to build
        run: |
          cp manifest.webmanifest dist/manifest.webmanifest
          cp sw.js dist/sw.js
          cp icon.svg dist/icon.svg
          cp index.html dist/404.html

      - name: Verify Pages package
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          echo "Arquivos publicados:"
          find dist -maxdepth 2 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
