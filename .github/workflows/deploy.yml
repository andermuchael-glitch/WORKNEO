name: Deploy WORKNEO to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build web with cloud sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Prepare GitHub Pages files
        run: |
          cp manifest.webmanifest dist/manifest.webmanifest
          cp sw.js dist/sw.js
          cp icon.svg dist/icon.svg
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

          test -f dist/index.html
          test -f dist/404.html

          # The Pages artifact must contain the Vite-built entry point,
          # never the source index that points to ./src/main.jsx.
          grep -q 'assets/index-' dist/index.html
          ! grep -q './src/main.jsx' dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
