<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d"><meta name="description" content="WORKNEO - listas, relatórios e costura"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>WORKNEO</title><style>html,body{margin:0;min-height:100%;background:#fff}#root{min-height:100vh}.boot-message{box-sizing:border-box;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Arial,sans-serif;color:#14213d;text-align:center}.boot-card{max-width:520px;padding:28px;border:1px solid #d9e2ee;border-radius:16px;background:#fff;box-shadow:0 8px 30px #14213d14}.boot-card h2{margin:0 0 10px}.boot-card p{margin:8px 0 18px;line-height:1.5}.boot-card button{border:0;border-radius:9px;padding:11px 18px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer}</style></head><body><div id="root"><div class="boot-message" id="boot"><div class="boot-card"><h2>WORKNEO</h2><p>Carregando o aplicativo...</p></div></div></div><script>window.__WORKNEO_BOOT__=Date.now();window.addEventListener('error',function(e){var r=document.getElementById('root');if(r&&!r.dataset.rendered){r.innerHTML='<div class="boot-message"><div class="boot-card"><h2>WORKNEO</h2><p>O aplicativo encontrou um erro ao carregar esta versão.</p><button onclick="location.reload()">RECARREGAR</button></div></div>';console.error(e.error||e.message)}});window.addEventListener('unhandledrejection',function(e){var r=document.getElementById('root');if(r&&!r.dataset.rendered){r.innerHTML='<div class="boot-message"><div class="boot-card"><h2>WORKNEO</h2><p>Não foi possível iniciar o aplicativo.</p><button onclick="location.reload()">RECARREGAR</button></div></div>';console.error(e.reason)}});</script><script type="module" src="./src/main.jsx?v=20260925-1335"></script></body></html>
