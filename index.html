<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1769e0" />
    <meta name="description" content="Almoxarifado de produtos, cores, listas e lançamentos de quantidade." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest?v=11" />
    <link rel="icon" href="./icon.svg?v=11" type="image/svg+xml" />
    <title>Almoxarifado</title>
    <style>body{margin:0;font-family:Arial,sans-serif;background:#f6f8fb;color:#172033}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot-card{padding:32px}.boot-icon{font-size:52px}.boot h1{margin:10px 0 6px}.boot p{color:#667085}.list-card{position:relative}.list-delete{position:absolute;right:42px;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;border:0;border-radius:12px;background:#3a4352;color:#ff6b6b;font-size:20px;display:grid;place-items:center;cursor:pointer}.list-delete:active{transform:translateY(-50%) scale(.94)}</style>
    <script>
      if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js?v=11', {scope:'./'}).catch(() => {}); }); }
      (function(){
        function addDeleteButtons(){ var cards=Array.from(document.querySelectorAll('.list-card')); var raw=localStorage.getItem('almox-lists')||'[]'; var lists=[]; try{lists=JSON.parse(raw)}catch(e){lists=[]}
          cards.forEach(function(card,index){ if(card.querySelector('.list-delete')) return; var list=lists[index]; if(!list||!list.id) return; var btn=document.createElement('span');btn.className='list-delete';btn.textContent='🗑️';btn.title='Apagar lista';btn.setAttribute('role','button');btn.setAttribute('aria-label','Apagar lista '+(list.name||''));
            btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();try{var currentLists=JSON.parse(localStorage.getItem('almox-lists')||'[]');var target=currentLists.find(function(l){return l&&String(l.id)===String(list.id)});if(!target)return;if(!window.confirm('Apagar a lista "'+(target.name||'Lista')+'?\n\nEssa ação não pode ser desfeita.'))return;var next=currentLists.filter(function(l){return !l||String(l.id)!==String(target.id)});localStorage.setItem('almox-lists',JSON.stringify(next));if(String(localStorage.getItem('almox-current')||'')===String(target.id))localStorage.removeItem('almox-current');window.location.reload()}catch(err){alert('Não foi possível apagar a lista.')}});card.appendChild(btn); }); }
        window.addEventListener('DOMContentLoaded',function(){addDeleteButtons();var root=document.getElementById('root')||document.body;new MutationObserver(addDeleteButtons).observe(root,{childList:true,subtree:true});});
      })();
      (function(){
        window.setTimeout(function(){
          var root=document.getElementById('root');
          if(root && root.querySelector('.boot')){
            try{localStorage.setItem('workneo-recovery','1')}catch(e){}
            try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).then(function(){return caches&&caches.keys?caches.keys():[]}).then(function(keys){return Promise.all((keys||[]).map(function(k){return caches.delete(k)}))}).finally(function(){window.location.replace('./?recovery=11')})}catch(e){window.location.reload()}
          }
        },4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="boot"><div class="boot-card"><div class="boot-icon">📦</div><h1>Almoxarifado</h1><p>Carregando aplicativo...</p></div></div></div>
    <script type="module" src="./src/main.jsx?v=20260911-11"></script>
    <script type="module" src="./src/productionPanel.js?v=20260911-11"></script>
    <script type="module" src="./src/costureiraSelector.js?v=20260911-11"></script>
    <script type="module" src="./src/printOrientation.js?v=20260911-11"></script>
    <script type="module" src="./src/reportHeader.js?v=20260911-11"></script>
  </body>
</html>
