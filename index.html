<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1769e0" />
    <meta name="description" content="Almoxarifado de produtos, cores, listas e lançamentos de quantidade." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest?v=22" />
    <link rel="icon" href="./icon.svg?v=22" type="image/svg+xml" />
    <title>Almoxarifado</title>
    <style>body{margin:0;font-family:Arial,sans-serif;background:#f6f8fb;color:#172033}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot-card{padding:32px}.boot-icon{font-size:52px}.boot h1{margin:10px 0 6px}.boot p{color:#667085}.list-card{position:relative}.list-delete{position:absolute;right:42px;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;border:0;border-radius:12px;background:#3a4352;color:#9cc3ff;font-size:20px;display:grid;place-items:center;cursor:pointer}.list-delete:active{transform:translateY(-50%) scale(.94)}</style>
    <script>
      if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js?v=22', {scope:'./'}).catch(function(){}); }); }
      (function(){
        var ARCHIVE_KEY='workneo-listas-arquivadas-v1';
        function addArchiveButtons(){
          var cards=Array.from(document.querySelectorAll('.list-card')),lists=[];
          try{lists=JSON.parse(localStorage.getItem('almox-lists')||'[]')}catch(e){}
          cards.forEach(function(card,index){
            if(card.querySelector('.list-delete')||card.querySelector('.wa-card-archive'))return;
            var list=lists[index]; if(!list||!list.id)return;
            var btn=document.createElement('span'); btn.className='list-delete wa-card-archive'; btn.textContent='🗂️'; btn.title='Arquivar lista'; btn.setAttribute('role','button');
            btn.addEventListener('click',function(e){
              e.preventDefault();e.stopPropagation();
              try{
                var a=JSON.parse(localStorage.getItem('almox-lists')||'[]'),t=a.find(function(x){return x&&String(x.id)===String(list.id)});
                if(!t)return;
                if(!confirm('Arquivar a lista "'+(t.name||'Lista')+'"?\n\nEla sairá da aba Listas e ficará disponível em Arquivadas. Os registros de costura serão preservados.'))return;
                var ar=[];try{ar=JSON.parse(localStorage.getItem(ARCHIVE_KEY)||'[]');if(!Array.isArray(ar))ar=[]}catch(err){ar=[]}
                ar=ar.filter(function(x){return !x||String(x.id)!==String(t.id)});ar.push(Object.assign({},t,{archivedAt:new Date().toISOString()}));
                localStorage.setItem(ARCHIVE_KEY,JSON.stringify(ar));
                localStorage.setItem('almox-lists',JSON.stringify(a.filter(function(x){return !x||String(x.id)!==String(t.id)})));
                if(String(localStorage.getItem('almox-current')||'')===String(t.id))localStorage.removeItem('almox-current');
                location.reload();
              }catch(err){alert('Não foi possível arquivar a lista.');}
            });
            card.appendChild(btn);
          });
        }
        window.addEventListener('DOMContentLoaded',function(){
          addArchiveButtons();
          var root=document.getElementById('root')||document.body;
          new MutationObserver(addArchiveButtons).observe(root,{childList:true,subtree:true});
        });
      })();
      (function(){
        window.setTimeout(function(){
          var root=document.getElementById('root');
          if(root&&root.querySelector('.boot')){
            try{
              Promise.resolve().then(function(){return navigator.serviceWorker&&navigator.serviceWorker.getRegistrations?navigator.serviceWorker.getRegistrations():[];})
                .then(function(rs){return Promise.all((rs||[]).map(function(r){return r.unregister();}));})
                .then(function(){return caches&&caches.keys?caches.keys():[];})
                .then(function(keys){return Promise.all((keys||[]).map(function(k){return caches.delete(k);}));})
                .finally(function(){location.replace('./?recovery=22');});
            }catch(e){location.reload();}
          }
        },4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="boot"><div class="boot-card"><div class="boot-icon">📦</div><h1>Almoxarifado</h1><p>Carregando aplicativo...</p></div></div></div>

    <script type="module" src="./src/saldoGeralCostura.js?v=20260916-01"></script>
    <script type="module" src="./src/costuraReportGuard.js?v=20260916-02"></script>

  </body>
</html>
