<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1769e0" />
    <meta name="description" content="Almoxarifado de produtos, cores, listas e lançamentos de quantidade." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest?v=4" />
    <link rel="icon" href="./icon.svg?v=4" type="image/svg+xml" />
    <title>Almoxarifado</title>
    <style>body{margin:0;font-family:Arial,sans-serif;background:#f6f8fb;color:#172033}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot-card{padding:32px}.boot-icon{font-size:52px}.boot h1{margin:10px 0 6px}.boot p{color:#667085}.list-card{position:relative}.list-delete{position:absolute;right:42px;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;border:0;border-radius:12px;background:#3a4352;color:#ff6b6b;font-size:20px;display:grid;place-items:center;cursor:pointer}.list-delete:active{transform:translateY(-50%) scale(.94)}</style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(() => {});
        });
      }

      // Ações auxiliares da tela de listas. Mantém a exclusão disponível
      // sem alterar os dados dos lançamentos existentes.
      (function(){
        function addDeleteButtons(){
          document.querySelectorAll('.list-card').forEach(function(card){
            if(card.querySelector('.list-delete')) return;
            var id = card.getAttribute('data-list-id');
            if(!id) return;
            var btn=document.createElement('span');
            btn.className='list-delete';
            btn.textContent='🗑️';
            btn.title='Apagar lista';
            btn.setAttribute('role','button');
            btn.setAttribute('aria-label','Apagar lista');
            btn.addEventListener('click',function(e){
              e.preventDefault();
              e.stopPropagation();
              try{
                var lists=JSON.parse(localStorage.getItem('almox-lists')||'[]');
                var list=lists.find(function(l){return l&&String(l.id)===String(id)});
                if(!list) return;
                if(!window.confirm('Apagar a lista "'+(list.name||'Lista')+'"?\n\nEssa ação não pode ser desfeita.')) return;
                var next=lists.filter(function(l){return !l||String(l.id)!==String(id)});
                localStorage.setItem('almox-lists',JSON.stringify(next));
                if(String(localStorage.getItem('almox-current')||'')===String(id)){
                  localStorage.removeItem('almox-current');
                }
                window.location.reload();
              }catch(err){ alert('Não foi possível apagar a lista.'); }
            });
            card.setAttribute('data-list-id',id);
            card.appendChild(btn);
          });
        }
        var observer=new MutationObserver(addDeleteButtons);
        window.addEventListener('DOMContentLoaded',function(){
          addDeleteButtons();
          observer.observe(document.getElementById('root')||document.body,{childList:true,subtree:true});
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="boot"><div class="boot-card"><div class="boot-icon">📦</div><h1>Almoxarifado</h1><p>Carregando aplicativo...</p></div></div></div>
    <script type="module" src="./src/main.jsx?v=20260910-4"></script>
  </body>
</html>
