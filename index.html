    <title>Almoxarifado</title>
    <style>body{margin:0;font-family:Arial,sans-serif;background:#f6f8fb;color:#172033}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot-card{padding:32px}.boot-icon{font-size:52px}.boot h1{margin:10px 0 6px}.boot p{color:#667085}.list-card{position:relative}</style>
    <script>
      if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js?v=22', {scope:'./'}).catch(function(){}); }); }
      (function(){
        window.setTimeout(function(){
          var root=document.getElementById('root');
          if(root&&root.querySelector('.boot')){
            try{
              Promise.resolve().then(function(){return navigator.serviceWorker&&navigator.serviceWorker.getRegistrations?navigator.serviceWorker.getRegistrations():[];})
                .then(function(rs){return Promise.all((rs||[]).map(function(r){return r.unregister();}));})
                .then(function(){return caches&&caches.keys?caches.keys():[];})
                .then(function(keys){return Promise.all((keys||[]).map(function(k){return caches.delete(k);}));})
                .finally(function(){location.replace('./?recovery=22');});
            }catch(e){location.reload();}
          }
        },4000);
      })();
    </script>
  </head>
